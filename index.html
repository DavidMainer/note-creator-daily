<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Notes</title>
  <style>
    :root {
      --bg: #f5deb3;           /* Wheat main background */
      --card: #fdf8ee;         /* Soft cream card */
      --ink: #1e2a24;          /* Deep forest charcoal text */
      --muted: #5c6b64;        /* Muted slate-green text */
      --jungle: #29ab87;       /* Jungle Green primary */
      --jungle-dark: #218c6e;
      --orange: #ff8c00;       /* Orange primary */
      --border: #d9be8f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      display: flex;
      justify-content: center;
      padding: 3rem 1rem;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 560px;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--jungle-dark);
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* Writing Box */
    .composer {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 8px 24px rgba(30, 42, 36, 0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .composer:focus-within {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(30, 42, 36, 0.1);
      border-color: var(--jungle);
    }

    textarea {
      width: 100%;
      border: none;
      resize: none;
      font-family: inherit;
      font-size: 1rem;
      color: var(--ink);
      min-height: 90px;
      outline: none;
      background: transparent;
    }

    .composer-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .status-msg {
      font-size: 0.85rem;
      color: var(--orange);
      font-weight: 600;
    }

    button {
      background: transparent;
      background-image: linear-gradient(from 30deg,rgb(146, 2, 2),rgb(0, 0, 0));
      color: #140101;
      border: none;
      padding: 0.6rem 1.35rem;
      border-radius: 99px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button:hover { background: var(--jungle-dark); }
    button:active { transform: scale(0.96); }

    /* Notes List */
    .entries {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .note-card {
      background: var(--card);
      border: 2px solid var(--jungle);
      border-left: 6px solid var(--orange);
      border-radius: 14px;
      padding: 1.25rem;
      animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .note-header {
      margin-bottom: 0.5rem;
    }

    .day-badge {
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--orange);
    }

    .note-body {
      font-size: 1rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Daily Notes</h1>
      <p>Jot down your daily thoughts and reminders.</p>
    </header>

    <div class="composer">
      <textarea id="text" placeholder="Write a note..."></textarea>
      <div class="composer-footer">
        <span id="status" class="status-msg"></span>
        <button onclick="createNote()">Add Note</button>
      </div>
    </div>

    <div id="entries" class="entries"></div>
  </div>

  <script>
    const API_URL = "http://localhost:3000/api/notes";

    async function loadNotes() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) return;
        const notes = await res.json();
        renderNotes(notes);
      } catch (err) {
        // Silently handle offline state
      }
    }

    async function createNote() {
      const input = document.getElementById("text");
      const status = document.getElementById("status");
      const text = input.value;

      status.textContent = "";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });

        const data = await res.json();
        if (!res.ok) {
          status.textContent = data.error || "Please write a note first.";
          return;
        }

        input.value = "";
        status.textContent = "Saved";
        setTimeout(() => (status.textContent = ""), 2500);
        loadNotes();
      } catch (err) {
        // Silently handle offline state
      }
    }

    function renderNotes(notes) {
      const container = document.getElementById("entries");

      container.innerHTML = notes.map((note) => `
        <div class="note-card">
          <div class="note-header">
            <span class="day-badge">${note.day}</span>
          </div>
          <div class="note-body">${note.text}</div>
        </div>
      `).join("");
    }

    loadNotes();
  </script>
</body>
</html>
